<body>
  <div id="sideBg" aria-hidden="true"></div>

  <div id="app">
    <!-- Scene 0: loading -->
    <div id="loading" class="ff" role="dialog" aria-label="Loading">
      <p class="presents"></p>
      <p class="prep" aria-live="polite"></p>
      <div class="loadbar" aria-hidden="true"><i></i></div>
      <p class="loadpct" aria-hidden="true">0%</p>
      <p class="tip"><span></span></p>
      <button id="begin" class="btn primary">Tap to begin</button>
    </div>

    <!-- All scenes are generated from CONFIG in main.js -->
    <main id="world"></main>

    <noscript>
      <div style="padding:40px 24px;text-align:center;font-size:18px">
        <h1>Kavya &amp; Siddharth</h1>
        <p>Friday, 21 January 2028 · 6:30 PM · Hampi, Karnataka</p>
        <p>Kindly RSVP on WhatsApp: <a href="https://wa.me/919999999999">+91 99999 99999</a> by 21 December 2027.</p>
      </div>
    </noscript>
  </div>

  <!-- atmosphere layered over every scene -->
  <div id="fx" class="ff" aria-hidden="true">
    <canvas id="particles"></canvas>
    <div id="veil"></div>
    <div id="vignette"></div>
    <div id="grain"></div>
    <div id="flash"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
